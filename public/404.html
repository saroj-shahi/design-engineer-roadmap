<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>Page not found · Design Engineer Field Guide</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <style>
      :root { --desk:#e2dfd6; --card:#f7f6f2; --ink:#111111; --ink-2:#3d3c38; --accent-ink:#b82a00; --edge:#111111; }
      @media (prefers-color-scheme: dark) {
        :root { --desk:#060606; --card:#131312; --ink:#edebe5; --ink-2:#bab8b0; --accent-ink:#ff7a4d; --edge:#8f8c84; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--desk); color: var(--ink); font: 16px/1.55 ui-sans-serif, system-ui, sans-serif; }
      main { width: 100%; max-width: 40rem; background: var(--card); border: 2px solid var(--edge); padding: 2rem; box-shadow: 4px 4px 0 var(--edge); }
      .label { font: 400 11px/1.3 ui-monospace, Menlo, monospace; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-ink); margin: 0; }
      h1 { margin: 0.75rem 0 0; font-size: clamp(2rem, 6vw, 3.25rem); line-height: 0.95; letter-spacing: -0.02em; }
      p { margin: 1rem 0 0; color: var(--ink-2); }
      ul { list-style: none; padding: 0; margin: 1.5rem 0 0; display: flex; flex-wrap: wrap; gap: 0.75rem; }
      a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1rem; border: 2px solid var(--edge); color: var(--ink); text-decoration: none; font: 500 14px/1 ui-sans-serif, system-ui, sans-serif; }
      a:hover, a:focus-visible { background: var(--edge); color: var(--card); outline: 2px solid var(--accent-ink); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="label">404 · Page not found</p>
      <h1>That page doesn't exist.</h1>
      <p>The link may be mistyped or out of date. Open one of the guide's five pages instead.</p>
      <nav aria-label="Guide pages">
        <ul>
          <li><a href="/#/">Start</a></li>
          <li><a href="/#/roles">Roles</a></li>
          <li><a href="/#/plan">Plan</a></li>
          <li><a href="/#/ready">Checklist</a></li>
          <li><a href="/#/library">Library</a></li>
        </ul>
      </nav>
    </main>
  </body>
</html>
